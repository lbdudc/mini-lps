plugins {
  id "org.springframework.boot" version "3.1.2"
  id "com.diffplug.spotless" version "6.19.0"
  id "java"
  id "com.github.ManifestClasspath" version "0.1.0-RELEASE"
}

apply plugin: "io.spring.dependency-management"
apply plugin: "application"
apply plugin: "eclipse"
mainClassName = "es.udc.lbd.gema.lps.Application"

group = "es.udc.lbd.gema"
version = "/*%= data.basicData.version %*/"
sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
  // download.osgeo.org/webdav/geotools, maven.geotoolkit.org and
  // jasperreports.sourceforge.net/maven2 were removed here: the first two no
  // longer serve any GeoTools artifact (repo.osgeo.org is the artifact's real
  // home and already covers it below; maven.geotoolkit.org doesn't resolve at
  // all any more, same finding lps already acted on), and no dependency below
  // pulls anything from org.jasperreports.
  maven { url "https://repo.osgeo.org/repository/release/" }
  /*% if (feature.MV_MS_GeoServer) { %*/
  // https, not the historical http://maven.geo-solutions.it — the plain-http
  // host now just 301s here, so serving it directly needs no
  // allowInsecureProtocol escape hatch.
  maven { url "https://maven.geo-solutions.it/" }
  /*% } %*/
  mavenCentral()
}

dependencies {
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation "org.springframework.boot:spring-boot-starter-data-jpa"
  implementation "org.springframework.boot:spring-boot-starter-validation"
  implementation "org.springframework.boot:spring-boot-starter-web"
  /*% if (feature.T_GIS) { %*/
  implementation "org.hibernate:hibernate-spatial:6.1.1.Final"
  implementation "org.geotools:gt-geojson:26.4"
  implementation "org.geotools:gt-shapefile:26.4"
  implementation "org.geotools:gt-epsg-hsql:26.4"
  /*% } %*/
  /*% if (feature.T_FileUploader) { %*/
  implementation "org.quartz-scheduler:quartz:2.3.2"
  implementation "org.springframework.boot:spring-boot-starter-quartz"
  implementation "commons-io:commons-io:2.11.0"
  /*% } %*/

  implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
  implementation "com.fasterxml.jackson.core:jackson-databind"
  implementation "commons-beanutils:commons-beanutils:1.9.4"

  runtimeOnly "org.postgresql:postgresql:42.7.13"

  implementation "net.kaczmarzyk:specification-arg-resolver:2.6.2"
  /*% if (feature.T_Swagger) { %*/
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
  /*% } %*/

  /*% if (feature.MV_MS_GeoServer) { %*/
  implementation "it.geosolutions:geoserver-manager:1.7.0"
  /*% } %*/

  testImplementation "org.springframework.boot:spring-boot-starter-test"
}

spotless {
  java {
    googleJavaFormat()
  }
}

bootRun {
  if (project.hasProperty('args')) {
    args project.args.split(',')
  }
}

compileJava.dependsOn "spotlessApply"
