# A deployment to another machine publishes no port of its own services (only nginx, or the
# HTTPS front, is reachable): they answer inside the compose network, and this also keeps
# them from clashing with whatever already listens on the server's 5432, 8080...
/*% const publicDeploy = getExtraConfigFromSpec(data, 'public_deploy', '') === 'true'; %*/
# With a domain, Caddy is the only service on 80/443: it gets the HTTPS certificate and hands
# the requests to nginx.
/*% const portable = getExtraConfigFromSpec(data, 'portable', '') === 'true'; %*/
/*% const hasLiveLayers = ((data.mapViewer && data.mapViewer.layers) || []).some(function(l) { return l.live; }); %*/
/*% const isolatedGeoserver = getExtraConfigFromSpec(data, 'isolated_geoserver', '') === 'true'; %*/
/*% const domain = feature.D_C_Nginx ? getExtraConfigFromSpec(data, 'domain', '') : ''; %*/
services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        JAR_NAME: /*%= normalize(data.basicData.name) %*//*% if (data.basicData.version) { %*/-/*%= data.basicData.version %*//*% } %*/
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-server
    /*% if (feature.D_C_Geoserver || feature.D_C_Postgres ) { %*/
    depends_on:
      /*% if (feature.D_C_Geoserver) { %*/
      geoserver:
        condition: service_healthy
      /*% } %*/
      /*% if (feature.D_C_Postgres) { %*/
      postgres:
        condition: service_healthy
      /*% } %*/
    /*% } %*/
    networks:
      - local
    restart: unless-stopped
    /*% if (!publicDeploy) { %*/
    ports:
      - '/*%= getExtraConfigFromSpec(data, 'server_deploy_port', '9001') %*/:/*%= getExtraConfigFromSpec(data, 'server_deploy_port', '9001') %*/'
    /*% } %*/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:/*%= getExtraConfigFromSpec(data, 'server_deploy_port', '9001') %*//actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 30s
  /*% if (feature.DM_DI_DF_Shapefile || feature.DM_DI_DF_GeoTIFF) { %*/
  data-importer:
    build:
      context: ./importer
      dockerfile: Dockerfile
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-data-importer
    # Runs to completion: code-uploader's deploy waits for it to exit (not just to start), so
    # the deploy only reports success once the data is loaded.
    labels:
      gp.oneshot: "true"
    environment:
      SERVER_HOST: 'http://server:/*%= getExtraConfigFromSpec(data, 'server_deploy_port', '9001') %*/'
      /*% if (feature.D_C_Geoserver) { %*/
      GEOSERVER_URL: 'http://geoserver:8080/geoserver'
      /*% } %*/
    # The data is mounted, not baked into the image: the image stays tiny and cached, and a
    # redeploy that only changes the data doesn't rebuild anything. importer-state remembers
    # which version of each file the database holds (it goes away with the database on `down -v`).
    volumes:
      - ./importer/data:/app/data:ro
      - importer-state:/state
    depends_on:
      server:
        condition: service_healthy
    networks:
      - local
    restart: "no"
  /*% } %*/
  client:
    build:
      context: ../client
      dockerfile: ../client/deploy/Dockerfile
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-client
    networks:
      - local
    restart: unless-stopped
    /*% if (!feature.D_C_Nginx) { %*/
    ports:
      - '1080:80'
    /*% } %*/

  /*% if (feature.D_C_Postgres) { %*/
  postgres:
    container_name: ${PG_CONTAINER_NAME}
    build:
      context: ./postgres
      dockerfile: postgres.dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASSWORD}
      PGDATA: ${PGDATA}
      POSTGRES_MULTIPLE_EXTENSIONS: ${POSTGRES_MULTIPLE_EXTENSIONS}
      POSTGRES_RUN_AS_ROOT: ${POSTGRES_RUN_AS_ROOT}
    volumes:
      - postgres:/data/postgres
    networks:
      - local
    /*% if (!publicDeploy) { %*/
    ports:
      - "5432:5432"
    /*% } %*/
    restart: on-failure
    # Without an interval Docker checks every 30s, so `server` (which waits for this) started up
    # to 30s after Postgres was actually ready.
    healthcheck:
      test: "PGPASSWORD=${POSTGRES_PASSWORD} pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  /*% } %*/

  /*% if (feature.MV_Processes) { %*/
  qgis-wps-init:
    image: busybox
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-qgis-wps-init
    command: chown -R ${QGSWPS_USER:-9001:9001} /projects
    volumes:
      - projects:/projects

  py-qgis-wps:
    image: 3liz/qgis-wps:3.28
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-qgis-wps
    user: root
    depends_on:
      qgis-wps-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      /*% if (feature.D_C_Postgres) { %*/
      postgres:
        condition: service_healthy
      /*% } %*/
    environment:
      QGSWPS_SERVER_PARALLELPROCESSES: ${QGSWPS_SERVER_PARALLELPROCESSES}
      QGSWPS_SERVER_LOGSTORAGE: REDIS
      QGSWPS_SERVER_ADMIN_REALM: '+lvm+'
      QGSWPS_SERVER_ENABLE_JOB_REALM: 'yes'
      QGSWPS_REDIS_HOST: redis
      QGSWPS_PROCESSING_PROVIDERS_MODULE_PATH: /processing
      QGSWPS_CACHE_ROOTDIR: /projects
      QGSWPS_SERVER_WORKDIR: /results
      QGSWPS_SERVER_HTTP_PROXY: 'yes'
      QGSWPS_SERVER_PROXY_URL: ${QGSWPS_SERVER_PROXY_URL}
      QGSWPS_LOGLEVEL: ${QGSWPS_LOGLEVEL}
      QGSWPS_PROCESSING_CRS: ${QGSWPS_PROCESSING_CRS:-EPSG:4326}
      QGSWPS_GEOSERVER_URL: ${QGSWPS_GEOSERVER_URL}
      QGSWPS_SERVER_RESPONSE_EXPIRATION: ${QGSWPS_SERVER_RESPONSE_EXPIRATION:-86400}
      QGSWPS_SERVER_RESULTS_MAP_URI: /results/
      QGSWPS_SERVER_OWS_SERVICE_URL: ${QGSWPS_SERVER_OWS_SERVICE_URL}
      QGSWPS_SERVER_RESTARTMON: /processing/models
      QGSWPS_USER: ${QGSWPS_USER}
      QGSWPS_DB_NAME: ${QGSWPS_DB_NAME}
      QGSWPS_DB_HOST: ${QGSWPS_DB_HOST}
      QGSWPS_DB_PORT: ${QGSWPS_DB_PORT}
      QGSWPS_DB_USER: ${QGSWPS_DB_USER}
      QGSWPS_DB_PASSWORD: ${QGSWPS_DB_PASSWORD}
    volumes:
      - "../qgis/processing:/processing"
      - ${QGSWPS_MODELS_PATH}:/processing/models
      - projects:/projects
      - results:/results
    networks:
      - local
    restart: unless-stopped
    /*% if (!publicDeploy) { %*/
    ports:
      - "8888:8080"
    /*% } %*/
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/processes', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  py-qgis-server:
    image: 3liz/qgis-map-server:3.40
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-qgis-server
    environment:
      QGSRV_SERVER_WORKERS: ${QGSRV_SERVER_WORKERS}
      QGSWPS_SERVER_HTTP_PROXY: 'yes'
      QGSWPS_SERVER_PROXY_URL: ${QGSRV_SERVER_PROXY_URL}
      QGSRV_LOGGING_LEVEL: ${QGSRV_LOGGING_LEVEL}
      QGSRV_CACHE_ROOTDIR: /results/
      QGSRV_CACHE_STRICT_CHECK: 'no'
    volumes:
      - results:/results
    networks:
      - local
    restart: unless-stopped
    /*% if (!publicDeploy) { %*/
    ports:
      - "8082:8080"
    /*% } %*/

  redis:
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-qgis-redis
    image: redis:4
    networks:
      - local
    restart: unless-stopped
  /*% } %*/

  /*% if (feature.D_C_Geoserver) { %*/
  geoserver:
    container_name: ${GEOSERVER_CONTAINER_NAME}
    image: docker.osgeo.org/geoserver:2.26.2
    /*% if (hasLiveLayers) { %*/
    # A live layer's source on the machine running this stack is reached as host.docker.internal
    # (the name Docker Desktop gives the host: Linux needs it declared)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    /*% } %*/
    environment:
      - CORS_ENABLED=${GEOSERVER_CORS_ENABLED}
      - INSTALL_EXTENSIONS=${GEOSERVER_INSTALL_EXTENSIONS}
      - EXTRA_JAVA_OPTS=${GEOSERVER_EXTRA_JAVA_OPTS}
      - GEOSERVER_CSRF_WHITELIST=${GEOSERVER_CSRF_WHITELIST}
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD}
    volumes:
      /*% if (isolatedGeoserver) { %*/
      # The app's own data folder: it goes with the database on `down -v` (so the two never
      # disagree), and the admin password above is the one only this app knows.
      - geoserver-data:/opt/geoserver_data
      /*% } else { %*/
      - /opt/ci/deployments/geoserver/data/:/opt/geoserver_data:Z
      /*% } %*/
      /*% if (!portable) { %*/
      - /opt/ci/deployments/geoserver/additional_libs:/opt/additional_libs:Z # by mounting this we can install libs from host on startup
      /*% } %*/
    networks:
      - local
    /*% if (!publicDeploy) { %*/
    ports:
      - "8080:8080"
    /*% } %*/
    restart: unless-stopped
    # Without this, `server`'s `depends_on: geoserver` (see above) only waits for
    # this container to start, not for GeoServer's own webapp deployment -- which
    # takes far longer than the container itself -- to actually accept requests.
    # `server`'s GeoServerInit then hits "Connection refused" for its entire
    # workspace/datastore/featuretype/style publishing sequence exactly once at
    # boot with no retry, so nothing gets published: every generated app layer and
    # style silently never reaches GeoServer, even though the run reports healthy.
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://localhost:8080/geoserver/web/"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  /*% } %*/
  /*% if (feature.D_C_Nginx) { %*/
  nginx:
    container_name: ${NGINX_CONTAINER_NAME}
    build:
      context: ./nginx
      dockerfile: nginx.dockerfile
    networks:
      - local
    volumes:
      - ../client/:/app/client/
    /*% if (domain) { %*/
    expose:
      - "80"
    /*% } else if (portable) { %*/
    # NGINX_BIND moves it out of the way of the HTTPS front (start.sh/start.ps1 --domain do it)
    ports:
      - "${NGINX_BIND:-80}:80"
    /*% } else { %*/
    ports:
      - "80:80"
    /*% } %*/
    depends_on:
      - server
      - client
      /*% if (feature.D_C_Geoserver) { %*/
      - geoserver
      /*% } %*/
    restart: unless-stopped

  /*% if (portable && feature.D_C_Nginx) { %*/
  # Only with `--profile https` (start.sh/start.ps1 --domain <name>): Caddy gets the HTTPS
  # certificate of DOMAIN from Let's Encrypt and hands the requests to nginx.
  https:
    profiles: ["https"]
    image: caddy:2-alpine
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-https
    networks:
      - local
    environment:
      DOMAIN: ${DOMAIN:-}
      CADDY_TLS: ${CADDY_TLS:-auto}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile.conf:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - nginx
    restart: unless-stopped

  /*% } %*/
  /*% if (domain) { %*/
  https:
    image: caddy:2-alpine
    container_name: /*%= normalizeKebabCase(data.basicData.name) %*/-https
    networks:
      - local
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile.conf:/etc/caddy/Caddyfile:ro
      # The certificates are kept outside the deployment folder and outside the named
      # volumes: a redeploy replaces the folder and `down -v` removes the volumes, and
      # asking for a new certificate each time would hit Let's Encrypt's rate limits.
      - /var/lib/gispublisher//*%= normalizeKebabCase(data.basicData.name) %*//caddy:/data
    depends_on:
      - nginx
    restart: unless-stopped

  /*% } %*/
  /*% } %*/
volumes:
/*% if (feature.D_C_Postgres) { %*/
  postgres:
    external: false
/*% } %*/
/*% if (feature.D_C_Geoserver && isolatedGeoserver) { %*/
  geoserver-data:
    external: false
/*% } %*/
/*% if (portable && feature.D_C_Nginx) { %*/
  caddy-data:
    external: false
/*% } %*/
/*% if (feature.DM_DI_DF_Shapefile || feature.DM_DI_DF_GeoTIFF) { %*/
  importer-state:
    external: false
/*% } %*/
/*% if (feature.MV_Processes) { %*/
  results:
    external: false
  projects:
    external: false
/*% } %*/
networks:
  local:
    driver: bridge
