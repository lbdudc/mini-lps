/*% if (feature.D_C_Nginx) { %*/
# Behind a TLS-terminating proxy (the HTTPS front) the request reaches nginx as plain http:
# keep the protocol the visitor used, so the backend and GeoServer see https.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # SSL configuration
    #
    # listen 443 ssl default_server;
    # listen [::]:443 ssl default_server;
    #
    # Note: You should disable gzip for SSL traffic.
    # See: https://bugs.debian.org/773332
    #
    # Read up on ssl_ciphers to ensure a secure configuration.
    # See: https://bugs.debian.org/765782
    #
    # Self signed certs generated by the ssl-cert package
    # Don't use them in a production server!
    #
    # include snippets/snakeoil.conf;

    root /var/www/html;

    # Add index.php to the list if you are using PHP
    index index.html index.htm index.nginx-debian.html;

    server_name _;

    location /backend/ {
      proxy_buffering off;
      proxy_store off;
      proxy_pass http:///*%= normalizeKebabCase(data.basicData.name) %*/-server:9001/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;

      proxy_connect_timeout       600;
      proxy_send_timeout          600;
      proxy_read_timeout          600;
      send_timeout                600;
    }

    /*% if (feature.MV_T_Editing) { %*/
    # The app has editable layers: anything that changes data needs the editing account.
    # Reading stays open. (The data importer talks to the server directly, not through here.)
    location /backend/api/entities/ {
      limit_except GET HEAD OPTIONS {
        auth_basic "Editing";
        auth_basic_user_file /etc/nginx/edit.htpasswd;
      }
      proxy_buffering off;
      proxy_store off;
      proxy_pass http:///*%= normalizeKebabCase(data.basicData.name) %*/-server:9001/api/entities/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;

      proxy_connect_timeout       600;
      proxy_send_timeout          600;
      proxy_read_timeout          600;
      send_timeout                600;
    }

    location /backend/api/import {
      limit_except GET HEAD OPTIONS {
        auth_basic "Editing";
        auth_basic_user_file /etc/nginx/edit.htpasswd;
      }
      proxy_buffering off;
      proxy_store off;
      proxy_pass http:///*%= normalizeKebabCase(data.basicData.name) %*/-server:9001/api/import;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;

      proxy_connect_timeout       600;
      proxy_send_timeout          600;
      proxy_read_timeout          600;
      send_timeout                600;
    }
    /*% } %*/

    /*% if (feature.D_C_Geoserver) { %*/
    /*% if (getExtraConfigFromSpec(data, 'public_deploy', '') === 'true') { %*/
    # The app only needs GeoServer's map services. Its admin pages and REST API are not for
    # the internet (the server reaches them directly, not through here).
    location ~ ^/geoserver/(web|rest|j_spring_security_check|j_spring_security_logout|gwc/rest) {
        return 403;
    }

    /*% } %*/
    location /geoserver/ {
        proxy_pass http:///*%= normalizeKebabCase(data.basicData.name) %*/-geoserver:8080/geoserver/;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
    /*% } %*/

    location / {
      proxy_buffering off;
      proxy_store off;
      proxy_pass http:///*%= normalizeKebabCase(data.basicData.name) %*/-client/;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;

      proxy_connect_timeout       600;
      proxy_send_timeout          600;
      proxy_read_timeout          600;
      send_timeout                600;
    }
}
/*% } %*/
