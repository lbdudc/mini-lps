/*%
  const portable = getExtraConfigFromSpec(data, 'portable', '') === 'true';
  const domain = feature.D_C_Nginx ? getExtraConfigFromSpec(data, 'domain', '') : '';
  const email = getExtraConfigFromSpec(data, 'acme_email', '');
  const internal = getExtraConfigFromSpec(data, 'tls_internal', '') === 'true';
%*/
/*% if (portable && feature.D_C_Nginx) { %*/
# The HTTPS front (the `https` profile of docker-compose.yml). Caddy asks Let's Encrypt for the
# certificate of $DOMAIN and renews it by itself. The domain must point at this machine and
# ports 80 and 443 must be open. To get expiry notices, add a block at the very top:
#   {
#     email you@example.org
#   }
# CADDY_TLS=internal (start.sh --internal-cert / start.ps1 -InternalCert): a certificate made by
# Caddy itself, for a name only your own network knows. Browsers warn until they trust it.
(auto) {
}
(internal) {
  tls internal
}

{$DOMAIN} {
  import {$CADDY_TLS:auto}
  encode zstd gzip
  reverse_proxy nginx:80
}
/*% } else if (domain) { %*/
# The HTTPS front (see the `https` service of docker-compose.yml): Caddy asks Let's Encrypt for
# the certificate of the domain and renews it by itself. The domain must point at this machine
# and ports 80 and 443 must be open. For localhost names and IP addresses it makes its own
# (untrusted) certificate, enough to try the app out.
/*% if (email) { %*/
{
  email /*%= email %*/
}
/*% } %*/

/*%= domain %*/ {
  /*% if (internal) { %*/
  tls internal
  /*% } %*/
  encode zstd gzip
  reverse_proxy nginx:80
}
/*% } %*/
